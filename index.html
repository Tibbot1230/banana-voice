<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🍌 Banana Voice Room (Live)</title>
  <style>
    :root {
      --bg: #0b1120;
      --card: #162032;
      --accent: #facc15;
      --accent-dark: #eab308;
      --green: #22c55e;
      --red: #ef4444;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background: radial-gradient(circle at top, #1e293b, #070b14);
      color: var(--text);
      min-height: 100dvh;
      display: flex;
      justify-content: center;
    }

    .app {
      width: 100%;
      max-width: 600px;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(22, 32, 50, 0.9);
      border: 1px solid rgba(250, 204, 21, 0.25);
      padding: 12px 14px;
      border-radius: 16px;
    }

    .brand {
      font-weight: 800;
      font-size: 1.05rem;
      color: var(--accent);
    }

    .badge {
      background: rgba(250, 204, 21, 0.15);
      color: var(--accent);
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }

    /* Lobby */
    .lobby {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 14px;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 20px;
      padding: 22px;
    }

    .lobby h2 {
      font-size: 1.25rem;
      color: var(--accent);
    }

    .lobby p {
      font-size: 0.9rem;
      color: var(--muted);
      line-height: 1.5;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .field label {
      font-size: 0.85rem;
      color: var(--muted);
    }

    .field input {
      background: #0b1120;
      border: 1px solid #334155;
      color: var(--text);
      padding: 12px 14px;
      border-radius: 12px;
      font-size: 1rem;
      outline: none;
    }

    .field input:focus {
      border-color: var(--accent);
    }

    .btn-join {
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #0b1120;
      border: none;
      padding: 14px;
      border-radius: 14px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
    }

    /* Room */
    .room-view {
      display: none;
      flex: 1;
      flex-direction: column;
      gap: 12px;
    }

    .room-view.active {
      display: flex;
    }

    .room-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      background: var(--card);
      padding: 10px 14px;
      border-radius: 14px;
      border: 1px solid rgba(148, 163, 184, 0.2);
    }

    .room-info {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .btn-copy {
      background: #334155;
      color: var(--text);
      border: none;
      padding: 7px 12px;
      border-radius: 10px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    .participants-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(115px, 1fr));
      gap: 10px;
    }

    .user-card {
      background: var(--card);
      border: 2px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      padding: 14px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      text-align: center;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .user-card.speaking {
      border-color: var(--green);
      box-shadow: 0 0 16px rgba(34, 197, 94, 0.35);
    }

    .avatar {
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: linear-gradient(135deg, var(--accent), var(--accent-dark));
      color: #0b1120;
      font-weight: 800;
      font-size: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .user-name {
      font-size: 0.88rem;
      font-weight: 600;
      max-width: 100%;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .mic-state {
      font-size: 0.75rem;
      color: var(--muted);
    }

    .mic-state.muted {
      color: var(--red);
    }

    .mic-state.live {
      color: var(--green);
    }

    /* Chat */
    .chat-panel {
      flex: 1;
      min-height: 140px;
      max-height: 220px;
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      padding: 10px;
      gap: 8px;
    }

    .chat-messages {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      font-size: 0.85rem;
    }

    .chat-line {
      color: #e2e8f0;
      line-height: 1.4;
      word-break: break-word;
    }

    .chat-line strong {
      color: var(--accent);
    }

    .chat-input-row {
      display: flex;
      gap: 6px;
    }

    .chat-input-row input {
      flex: 1;
      background: #0b1120;
      border: 1px solid #334155;
      color: var(--text);
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 0.88rem;
      outline: none;
    }

    .chat-input-row button {
      background: var(--accent);
      color: #0b1120;
      border: none;
      padding: 0 14px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Controls */
    .controls {
      display: flex;
      gap: 10px;
    }

    .btn-ctrl {
      flex: 1;
      padding: 13px;
      border-radius: 14px;
      border: none;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-mute {
      background: #334155;
      color: var(--text);
    }

    .btn-mute.is-muted {
      background: var(--red);
      color: #fff;
    }

    .btn-leave {
      background: rgba(239, 68, 68, 0.18);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.4);
    }

    .notice {
      font-size: 0.78rem;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">🍌 Banana Voice Room</div>
      <div class="badge" id="headerStatus">অফলাইন</div>
    </header>

    <!-- Lobby -->
    <section class="lobby" id="lobbyView">
      <h2>লাইভ ভয়েস রুমে যোগ দিন</h2>
      <p>একসাথে ১০–১৫ জন বন্ধু মিলে সরাসরি ভয়েস আড্ডা দিন। একই রুমের নাম দিয়ে জয়েন করলেই সবাই একসাথে কথা বলতে পারবেন।</p>

      <div class="field">
        <label for="nameInput">আপনার নাম</label>
        <input type="text" id="nameInput" placeholder="যেমন: রাকিব" maxlength="20" />
      </div>

      <div class="field">
        <label for="roomInput">রুমের নাম (বা কোড)</label>
        <input type="text" id="roomInput" placeholder="যেমন: banana-adda" maxlength="30" />
      </div>

      <button class="btn-join" id="joinBtn">🎙️ ভয়েস রুমে জয়েন করুন</button>
      <div class="notice" id="lobbyNotice"></div>
    </section>

    <!-- Live Room -->
    <section class="room-view" id="roomView">
      <div class="room-topbar">
        <div class="room-info">🔊 <span id="roomTitle"></span> • <span id="userCount">1</span>/15 জন</div>
        <button class="btn-copy" id="copyLinkBtn">🔗 লিঙ্ক কপি করুন</button>
      </div>

      <div class="participants-grid" id="participantsGrid"></div>

      <div class="chat-panel">
        <div class="chat-messages" id="chatMessages"></div>
        <div class="chat-input-row">
          <input type="text" id="chatInput" placeholder="রুমে মেসেজ লিখুন..." />
          <button id="sendChatBtn">পাঠান</button>
        </div>
      </div>

      <div class="controls">
        <button class="btn-ctrl btn-mute" id="muteBtn">🎙️ মিউট করুন</button>
        <button class="btn-ctrl btn-leave" id="leaveBtn">🚪 বের হন</button>
      </div>
      <div class="notice" id="roomNotice">কথা বলার জন্য বন্ধুদের সাথে ইনভাইট লিঙ্ক শেয়ার করুন।</div>
    </section>
  </div>

  <div id="audioContainer" style="display:none;"></div>

  <script type="module">
    import { joinRoom } from "https://esm.run/trystero";

    const lobbyView = document.getElementById("lobbyView");
    const roomView = document.getElementById("roomView");
    const headerStatus = document.getElementById("headerStatus");
    const nameInput = document.getElementById("nameInput");
    const roomInput = document.getElementById("roomInput");
    const joinBtn = document.getElementById("joinBtn");
    const lobbyNotice = document.getElementById("lobbyNotice");
    const roomTitle = document.getElementById("roomTitle");
    const userCount = document.getElementById("userCount");
    const copyLinkBtn = document.getElementById("copyLinkBtn");
    const participantsGrid = document.getElementById("participantsGrid");
    const chatMessages = document.getElementById("chatMessages");
    const chatInput = document.getElementById("chatInput");
    const sendChatBtn = document.getElementById("sendChatBtn");
    const muteBtn = document.getElementById("muteBtn");
    const leaveBtn = document.getElementById("leaveBtn");
    const roomNotice = document.getElementById("roomNotice");
    const audioContainer = document.getElementById("audioContainer");

    // Pre-fill room from URL ?room=xyz
    const urlParams = new URLSearchParams(window.location.search);
    const paramRoom = urlParams.get("room");
    roomInput.value = paramRoom || "banana-adda";
    nameInput.value = localStorage.getItem("banana_room_name") || "";

    let room = null;
    let myUserId = null;
    let myName = "";
    let currentRoomName = "";
    let localStream = null;
    let isMuted = false;
    let isSpeaking = false;
    let memberState = null;
    let chatAction = null;
    let audioCtx = null;
    let speakInterval = null;
    const connectedUsers = new Set();
    const audioElements = new Map();

    function addSystemChat(text) {
      const div = document.createElement("div");
      div.className = "chat-line";
      div.style.color = "#94a3b8";
      div.textContent = text;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function addChatMessage(sender, text) {
      const div = document.createElement("div");
      div.className = "chat-line";
      const strong = document.createElement("strong");
      strong.textContent = sender + ": ";
      const span = document.createElement("span");
      span.textContent = text;
      div.appendChild(strong);
      div.appendChild(span);
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function renderParticipants() {
      participantsGrid.innerHTML = "";
      const allStates = memberState ? memberState.getAll() : {};
      const ids = [myUserId, ...Array.from(connectedUsers)].filter(Boolean);
      const uniqueIds = [...new Set(ids)];

      userCount.textContent = uniqueIds.length;

      for (const uid of uniqueIds) {
        const info = allStates[uid] || {};
        const displayName = uid === myUserId ? `${myName} (আপনি)` : (info.name || "অতিথি");
        const muted = Boolean(info.muted);
        const speaking = Boolean(info.speaking) && !muted;

        const card = document.createElement("div");
        card.className = "user-card" + (speaking ? " speaking" : "");

        const avatar = document.createElement("div");
        avatar.className = "avatar";
        avatar.textContent = (displayName.trim()[0] || "🍌").toUpperCase();

        const nameEl = document.createElement("div");
        nameEl.className = "user-name";
        nameEl.textContent = displayName;

        const statusEl = document.createElement("div");
        statusEl.className = "mic-state " + (muted ? "muted" : speaking ? "live" : "");
        statusEl.textContent = muted ? "🔇 মিউট" : speaking ? "🔊 কথা বলছেন" : "🎙️ যুক্ত";

        card.appendChild(avatar);
        card.appendChild(nameEl);
        card.appendChild(statusEl);
        participantsGrid.appendChild(card);
      }
    }

    function attachAudio(userId, stream) {
      let audio = audioElements.get(userId);
      if (!audio) {
        audio = document.createElement("audio");
        audio.autoplay = true;
        audio.playsInline = true;
        audioContainer.appendChild(audio);
        audioElements.set(userId, audio);
      }
      audio.srcObject = stream;
      audio.play().catch(() => {
        roomNotice.textContent = "অডিও শুনতে স্ক্রিনে একবার ট্যাপ করুন।";
      });
    }

    function removeAudio(userId) {
      const audio = audioElements.get(userId);
      if (audio) {
        audio.srcObject = null;
        audio.remove();
        audioElements.delete(userId);
      }
    }

    function startVoiceDetector(stream) {
      try {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const source = audioCtx.createMediaStreamSource(stream);
        const analyser = audioCtx.createAnalyser();
        analyser.fftSize = 256;
        source.connect(analyser);
        const data = new Uint8Array(analyser.frequencyBinCount);

        speakInterval = setInterval(() => {
          if (!memberState) return;
          if (isMuted) {
            if (isSpeaking) {
              isSpeaking = false;
              memberState.set({ name: myName, muted: true, speaking: false });
            }
            return;
          }
          analyser.getByteFrequencyData(data);
          let sum = 0;
          for (let i = 0; i < data.length; i++) sum += data[i];
          const avg = sum / data.length;
          const nowSpeaking = avg > 14;
          if (nowSpeaking !== isSpeaking) {
            isSpeaking = nowSpeaking;
            memberState.set({ name: myName, muted: isMuted, speaking: isSpeaking });
          }
        }, 200);
      } catch (e) {
        // Ignore if AudioContext fails on restricted browser
      }
    }

    joinBtn.addEventListener("click", async () => {
      myName = nameInput.value.trim() || "বন্ধু";
      currentRoomName = roomInput.value.trim().toLowerCase().replace(/\s+/g, "-");
      if (!currentRoomName) {
        lobbyNotice.textContent = "অনুগ্রহ করে একটি রুমের নাম লিখুন।";
        return;
      }

      localStorage.setItem("banana_room_name", myName);
      joinBtn.disabled = true;
      joinBtn.textContent = "যুক্ত হচ্ছি...";
      lobbyNotice.textContent = "";

      try {
        localStream = await navigator.mediaDevices.getUserMedia({
          audio: {
            echoCancellation: true,
            noiseSuppression: true,
            autoGainControl: true
          },
          video: false
        });
        isMuted = false;
      } catch (err) {
        localStream = null;
        isMuted = true;
        lobbyNotice.textContent = "মাইক্রোফোন অনুমতি না পাওয়ায় শুধু শোনার মোডে যুক্ত হচ্ছেন।";
      }

      room = joinRoom(
        {
          appId: "tibbot1230/banana-voice-room",
          maxUsers: 16,
          identity: "none"
        },
        currentRoomName
      );

      const self = await room.getSelf();
      myUserId = self.userId;

      memberState = room.makeUserState("member", {
        name: myName,
        muted: isMuted,
        speaking: false
      });

      chatAction = room.makeAction("chat");

      // Register listeners before streaming
      room.onPeerStream((remoteStream, { userId }) => {
        attachAudio(userId, remoteStream);
      });

      room.onUserJoin(({ userId }) => {
        connectedUsers.add(userId);
        if (localStream) {
          room.addStream(localStream, { target: userId, metadata: { type: "mic" } }).catch(() => {});
        }
        renderParticipants();
        addSystemChat("• নতুন একজন রুমে যুক্ত হয়েছেন।");
      });

      room.onUserLeave(({ userId }) => {
        connectedUsers.delete(userId);
        removeAudio(userId);
        renderParticipants();
        addSystemChat("• একজন রুম থেকে বের হয়েছেন।");
      });

      room.onError((err) => {
        if (err?.code === "room-full") {
          roomNotice.textContent = "রুমটি পূর্ণ হয়ে গেছে (সর্বোচ্চ ১৫–১৬ জন)।";
        }
      });

      memberState.onChange(() => {
        renderParticipants();
      });

      chatAction.onMessage((data) => {
        if (data?.text) addChatMessage(data.name || "অতিথি", data.text);
      });

      await memberState.set({ name: myName, muted: isMuted, speaking: false });

      if (localStream) {
        await room.addStream(localStream, { metadata: { type: "mic" } }).catch(() => {});
        startVoiceDetector(localStream);
      }

      // Switch to room UI
      lobbyView.style.display = "none";
      roomView.classList.add("active");
      headerStatus.textContent = "লাইভ 🟢";
      roomTitle.textContent = currentRoomName;
      updateMuteButton();
      renderParticipants();
      addSystemChat(`• আপনি "${currentRoomName}" রুমে যুক্ত হয়েছেন।`);
    });

    function updateMuteButton() {
      if (!localStream) {
        muteBtn.textContent = "🔇 মাইক নেই";
        muteBtn.classList.add("is-muted");
        muteBtn.disabled = true;
        return;
      }
      muteBtn.disabled = false;
      if (isMuted) {
        muteBtn.textContent = "🔇 আনমিউট করুন";
        muteBtn.classList.add("is-muted");
      } else {
        muteBtn.textContent = "🎙️ মিউট করুন";
        muteBtn.classList.remove("is-muted");
      }
    }

    muteBtn.addEventListener("click", () => {
      if (!localStream) return;
      isMuted = !isMuted;
      localStream.getAudioTracks().forEach((t) => (t.enabled = !isMuted));
      if (memberState) {
        memberState.set({ name: myName, muted: isMuted, speaking: false });
      }
      updateMuteButton();
      renderParticipants();
    });

    function sendChat() {
      const msg = chatInput.value.trim();
      if (!msg || !chatAction) return;
      chatAction.send({ name: myName, text: msg });
      addChatMessage(myName + " (আপনি)", msg);
      chatInput.value = "";
    }

    sendChatBtn.addEventListener("click", sendChat);
    chatInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter") sendChat();
    });

    copyLinkBtn.addEventListener("click", async () => {
      const shareUrl = `${window.location.origin}${window.location.pathname}?room=${encodeURIComponent(currentRoomName)}`;
      try {
        await navigator.clipboard.writeText(shareUrl);
        copyLinkBtn.textContent = "✅ কপি হয়েছে!";
        setTimeout(() => (copyLinkBtn.textContent = "🔗 লিঙ্ক কপি করুন"), 2000);
      } catch {
        prompt("এই লিঙ্কটি কপি করে বন্ধুদের দিন:", shareUrl);
      }
    });

    leaveBtn.addEventListener("click", async () => {
      if (speakInterval) clearInterval(speakInterval);
      if (audioCtx) audioCtx.close().catch(() => {});
      if (localStream) localStream.getTracks().forEach((t) => t.stop());
      if (room) await room.leave();
      for (const uid of audioElements.keys()) removeAudio(uid);
      connectedUsers.clear();
      location.reload();
    });
  </script>
</body>
</html>
